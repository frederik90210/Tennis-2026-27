        const blob = new Blob(["<!DOCTYPE html>\n<html lang=\"de\" class=\"h-full\">\n" + updatedSource + "\n</html>"], { type: 'text/html;charset=utf-8;' });

      const validationResults = useMemo(() => {
        const issues = [];
        const monthlyCounts = {};

        schedule.forEach(item => {
          const date = item.date;
          const month = new Date(date).getMonth() + 1;
          const monthKey = getMonthKey(date);

          item.players.forEach(pId => {
            if (!monthlyCounts[pId]) monthlyCounts[pId] = {};
            monthlyCounts[pId][monthKey] = (monthlyCounts[pId][monthKey] || 0) + 1;

            if (pId === 'PU') {
              puSeasonCount++;
              if (!item.players.includes('FB')) {
                issues.push({
                  week: item.week,
                  date,
                  player: 'PU',
                  rule: `Spieltag am ${formatDate(date)}: Philipp U. spielt, aber Frank B. ist nicht eingeteilt!`
                });
              }
            }

            if (pId === 'MC') {
              if (PLAYER_RESTRICTIONS.MC.dates.includes(date) || month === 12) {
                issues.push({ week: item.week, date, player: 'MC', rule: `Marc C. ist am ${formatDate(date)} gesperrt!` });
              }
            }
            if (pId === 'FR') {
              if (PLAYER_RESTRICTIONS.FR.dates.includes(date)) {
                issues.push({ week: item.week, date, player: 'FR', rule: `Fredi R. ist am ${formatDate(date)} gesperrt!` });
              }
            }
            if (pId === 'VK') {
              if (PLAYER_RESTRICTIONS.VK.dates.includes(date)) {
                issues.push({ week: item.week, date, player: 'VK', rule: `Vanessa K. ist am ${formatDate(date)} gesperrt!` });
              }
            }
            if (pId === 'LS') {
              if (new Date(date) < new Date('2026-09-27')) {
                issues.push({ week: item.week, date, player: 'LS', rule: `Lutz S. steht erst ab 27.09.2026 zur Verfügung!` });
              }
            }
          });
        });

        if (puSeasonCount > 5) {
          issues.push({
            week: 'Saison',
            date: '2026-2027',
            player: 'PU',
            rule: `Philipp U. ist ${puSeasonCount}x eingetragen (Erlaubt: max. 5x pro Saison)!`
          });
        }

        ['FB', 'HR', 'MZ'].forEach(pId => {
          if (monthlyCounts[pId]) {
            Object.entries(monthlyCounts[pId]).forEach(([mKey, count]) => {
              if (count > 1) {
                const pName = players.find(p => p.id === pId)?.name;
                issues.push({
                  week: 'Monat',
                  date: mKey,
                  player: pId,
                  rule: `${pName} ist im Monat ${mKey} ${count}x eingetragen (Erlaubt: max. 1x pro Monat)!`
                });
              }
            });
          }
        });

        return issues;

      const playerStats = useMemo(() => {
        const counts = {};
        const playedDates = {};
        players.forEach(p => {
          counts[p.id] = 0;
          playedDates[p.id] = [];
        });
        
        let totalAssignedSlots = 0;
        schedule.forEach(item => {
          item.players.forEach(pId => {
            if (counts[pId] !== undefined) {
              counts[pId]++;
              playedDates[pId].push({ week: item.week, date: item.date });
              totalAssignedSlots++;
            }
          });
        });

        const costPerSlot = totalAssignedSlots > 0 ? (GESAMT_ABO_KOSTEN / totalAssignedSlots) : 0;

        return players.map(p => {
          const matchCount = counts[p.id] || 0;
          const totalCost = matchCount * costPerSlot;
          return {
            ...p,
            count: matchCount,
            cost: totalCost,
            costPerSlot,
            dates: playedDates[p.id] || []
          };

      const getMatchBalance = (assignedPlayerIds) => {

        }

        const matchPlayers = assignedPlayerIds.map(id => {
          const p = players.find(x => x.id === id);
          return p ? p : { id, name: id, rating: 3 };
        }).sort((a, b) => b.rating - a.rating);

        const sum = matchPlayers.reduce((acc, p) => acc + p.rating, 0);
        const avg = (sum / matchPlayers.length).toFixed(1);

        let teamA = [];
        let teamB = [];

        if (matchPlayers.length === 4) {
          teamA = [matchPlayers[0], matchPlayers[3]];
          teamB = [matchPlayers[1], matchPlayers[2]];
        } else {
          teamA = matchPlayers.slice(0, Math.ceil(matchPlayers.length / 2));
          teamB = matchPlayers.slice(Math.ceil(matchPlayers.length / 2));
        }

        const scoreA = teamA.reduce((acc, p) => acc + p.rating, 0);
        const scoreB = teamB.reduce((acc, p) => acc + p.rating, 0);

        let label = 'Ausgeglichen ⚖️';
        let color = 'bg-emerald-100 text-emerald-800 border-emerald-300 dark:bg-emerald-950/60 dark:text-emerald-300';

        if (Math.abs(scoreA - scoreB) > 2) {

          color = 'bg-amber-100 text-amber-800 border-amber-300 dark:bg-amber-950/60 dark:text-amber-300';

          color = 'bg-indigo-100 text-indigo-800 border-indigo-300 dark:bg-indigo-950/60 dark:text-indigo-300';

        return { avg, label, teamA, teamB, scoreA, scoreB, color };

        text += `\nViel Spaß auf dem Platz! 🏆`;

        window.open(url, '_blank');

                {(activeTab === 'costs' || isAdminMode) && (

                      isAdminMode

                >

                  <span className="hidden xs:inline">{darkMode ? "Heller Modus" : "Dunkler Modus"}</span>
                </button>

                {isAdminMode && (

          {tutorialStep !== null && currentTutorialObj && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-3 sm:p-4 pointer-events-auto transition-all">
              <div className="w-full max-w-md bg-zinc-900 border-2 border-amber-400 text-white rounded-2xl p-4 sm:p-6 shadow-2xl space-y-4 animate-in fade-in zoom-in duration-200 relative z-30">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-full bg-amber-400 text-zinc-950 font-black flex items-center justify-center text-sm shadow-md">
                      {tutorialStep + 1}
                    </div>
                    <span className="text-xs font-bold text-amber-400 uppercase tracking-wider">
                      Anleitung ({tutorialStep + 1} / {TUTORIAL_STEPS.length})
                    </span>
                  </div>
                  <button 
                    onClick={endTutorial}
                    className="touch-target p-1 text-zinc-400 hover:text-white transition"
                    title="Tutorial beenden"
                  >
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>

                {currentTutorialObj.type === 'homescreen' ? (
                  <div className="space-y-3.5">
                    <h3 className="text-base sm:text-lg font-bold text-amber-300 flex items-center gap-2">
                      <Icons.Smartphone className="w-5 h-5 text-amber-400" />
                      {currentTutorialObj.title}
                    </h3>

                    {homeScreenPromptChoice === null && (
                      <div className="space-y-3 pt-1">
                        <p className="text-xs sm:text-sm text-zinc-200 leading-relaxed">
                          Möchtest du diese Web-App als eigenes Icon auf dem Hauptbildschirm deines Smartphones speichern?
                        </p>
                        <div className="grid grid-cols-2 gap-2.5 pt-2">
                          <button
                            onClick={() => setHomeScreenPromptChoice('yes')}
                            className="touch-target bg-amber-400 hover:bg-amber-300 text-zinc-950 font-extrabold px-3 py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-md active:scale-95 transition"
                          >
                            Ja, gerne! 👍
                          </button>
                          <button
                            onClick={() => {
                              setHomeScreenPromptChoice('no');
                              nextTutorialStep();
                            }}
                            className="touch-target bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold px-3 py-2.5 rounded-xl text-xs flex items-center justify-center gap-1 shadow-md active:scale-95 transition"
                          >
                            Nein, danke
                          </button>
                        </div>
                      </div>
                    )}

                    {homeScreenPromptChoice === 'yes' && (
                      <div className="space-y-3">
                        <p className="text-xs text-zinc-300 font-bold">Welchen Internet-Browser nutzt du aktuell?</p>
                        <div className="grid grid-cols-3 gap-1.5">
                          <button
                            onClick={() => setSelectedBrowserInstructions('safari')}
                            className={`touch-target py-2 px-1 rounded-xl text-xs font-bold border transition ${
                              selectedBrowserInstructions === 'safari'
                                ? 'bg-amber-400 text-zinc-950 border-amber-300'
                                : 'bg-zinc-800 text-zinc-200 border-zinc-700 hover:bg-zinc-700'
                            }`}
                          >
                            Safari 🧭
                          </button>
                          <button
                            onClick={() => setSelectedBrowserInstructions('chrome')}
                            className={`touch-target py-2 px-1 rounded-xl text-xs font-bold border transition ${
                              selectedBrowserInstructions === 'chrome'
                                ? 'bg-amber-400 text-zinc-950 border-amber-300'
                                : 'bg-zinc-800 text-zinc-200 border-zinc-700 hover:bg-zinc-700'
                            }`}
                          >
                            Chrome 🌐
                          </button>
                          <button
                            onClick={() => setSelectedBrowserInstructions('firefox')}
                            className={`touch-target py-2 px-1 rounded-xl text-xs font-bold border transition ${
                              selectedBrowserInstructions === 'firefox'
                                ? 'bg-amber-400 text-zinc-950 border-amber-300'
                                : 'bg-zinc-800 text-zinc-200 border-zinc-700 hover:bg-zinc-700'
                            }`}
                          >
                            Firefox 🦊
                          </button>
                        </div>

                        {selectedBrowserInstructions === 'safari' && (
                          <div className="p-3 bg-zinc-950/80 border border-amber-400/30 rounded-xl space-y-1.5 text-xs text-zinc-200">
                            <p className="font-bold text-amber-300">Anleitung für Apple Safari (iPhone / iPad):</p>
                            <ol className="list-decimal list-inside space-y-1 text-[11px] leading-relaxed">
                              <li>Tippe unten in der Safari-Leiste auf das <strong>Teilen-Symbol</strong> 📤 (Quadrat mit Pfeil).</li>
                              <li>Scrolle in der Liste nach unten und wähle <strong>„Zum Home-Bildschirm“</strong> ➕.</li>
                              <li>Tippe oben rechts auf <strong>„Hinzufügen“</strong>. Fertig!</li>
                            </ol>
                          </div>
                        )}

                        {selectedBrowserInstructions === 'chrome' && (
                          <div className="p-3 bg-zinc-950/80 border border-amber-400/30 rounded-xl space-y-1.5 text-xs text-zinc-200">
                            <p className="font-bold text-amber-300">Anleitung für Google Chrome (Android & iOS):</p>
                            <ol className="list-decimal list-inside space-y-1 text-[11px] leading-relaxed">
                              <li>Tippe oben oder unten rechts auf das <strong>Drei-Punkte-Menü (⋮)</strong>.</li>
                              <li>Wähle die Option <strong>„Zum Startbildschirm hinzufügen“</strong> (oder <i>„App installieren“</i>).</li>
                              <li>Bestätige die Eingabe mit <strong>„Hinzufügen“</strong>. Fertig!</li>
                            </ol>
                          </div>
                        )}

                        {selectedBrowserInstructions === 'firefox' && (
                          <div className="p-3 bg-zinc-950/80 border border-amber-400/30 rounded-xl space-y-1.5 text-xs text-zinc-200">
                            <p className="font-bold text-amber-300">Anleitung für Mozilla Firefox:</p>
                            <ol className="list-decimal list-inside space-y-1 text-[11px] leading-relaxed">
                              <li>Tippe auf das <strong>Firefox Menü (⋮)</strong>.</li>
                              <li>Wähle <strong>„Zum Startbildschirm hinzufügen“</strong> oder <strong>„Installieren“</strong>.</li>
                              <li>Bestätige den Vorgang. Fertig!</li>
                            </ol>
                          </div>
                        )}

                        {selectedBrowserInstructions && (
                          <button
                            onClick={nextTutorialStep}
                            className="touch-target w-full bg-amber-400 hover:bg-amber-300 text-zinc-950 font-extrabold py-2.5 rounded-xl text-xs transition shadow-md mt-2 flex items-center justify-center gap-1"
                          >
                            Verstanden & Weiter <Icons.ChevronRight className="w-4 h-4" />
                          </button>
                        )}
                      </div>
                    )}
                  </div>
                ) : (
                  <div className="space-y-2">
                    <h3 className="text-base sm:text-lg font-bold text-amber-300">{currentTutorialObj.title}</h3>
                    <p className="text-xs sm:text-sm text-zinc-200 leading-relaxed whitespace-pre-line">
                      {currentTutorialObj.text}
                    </p>
                  </div>
                )}

                <div className="flex items-center justify-between pt-2 border-t border-zinc-800">
                  <button
                    onClick={prevTutorialStep}
                    disabled={tutorialStep === 0}
                    className={`touch-target px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1 transition ${
                      tutorialStep === 0 
                        ? 'opacity-30 cursor-not-allowed bg-zinc-800 text-zinc-500' 
                        : 'bg-zinc-800 hover:bg-zinc-700 text-zinc-200'
                    }`}
                  >
                    <Icons.ChevronLeft className="w-4 h-4" /> Zurück
                  </button>

                  <div className="flex items-center gap-1">
                    {TUTORIAL_STEPS.map((_, idx) => (
                      <div 
                        key={idx} 
                        className={`h-1.5 rounded-full transition-all ${
                          idx === tutorialStep ? 'w-5 bg-amber-400' : 'w-1.5 bg-zinc-700'
                        }`} 
                      />
                    ))}
                  </div>

                  {currentTutorialObj.type !== 'homescreen' && (
                    <button
                      onClick={nextTutorialStep}
                      className="touch-target px-4 py-2 bg-amber-400 hover:bg-amber-300 text-zinc-950 font-bold rounded-xl text-xs flex items-center gap-1 transition shadow-md"
                    >
                      {tutorialStep < TUTORIAL_STEPS.length - 1 ? (
                        <>Weiter <Icons.ChevronRight className="w-4 h-4" /></>
                      ) : (
                        'Fertig 👍'
                      )}
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {}
          {saveNoticeOpen && (
            <div className="fixed inset-0 z-50 bg-zinc-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className={`w-full max-w-sm rounded-2xl border shadow-2xl p-5 space-y-4 animate-in fade-in zoom-in duration-150 ${
                darkMode ? 'bg-zinc-900 border-zinc-800 text-zinc-100' : 'bg-stone-100 border-stone-300 text-zinc-900'
              }`}>
                <div className="flex items-center justify-between border-b pb-3 border-stone-300/80 dark:border-zinc-800">
                  <div className="flex items-center gap-2">
                    <div className="bg-emerald-500 text-zinc-950 p-1.5 rounded-lg font-bold">
                      <Icons.Save className="w-4 h-4" />
                    </div>
                    <h3 className="font-bold text-sm">index.html heruntergeladen!</h3>
                  </div>
                  <button 
                    onClick={() => setSaveNoticeOpen(false)}
                    className="touch-target p-1 rounded-lg text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 transition"
                  >
                    <Icons.X className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-2 text-xs leading-relaxed text-zinc-600 dark:text-zinc-300">
                  <p className="font-semibold text-emerald-600 dark:text-emerald-400">
                    ✅ Alle deine aktuellen Änderungen (Aufstellungen, Spielstärken & Zahlungsstatus) wurden in die neue index.html-Datei übernommen.
                  </p>
                  <p>
                    Lade diese heruntergeladene <strong>index.html</strong>-Datei einfach bei GitHub in deinem Repository hoch, um die Website online für alle zu aktualisieren.
                  </p>
                </div>

                <button
                  onClick={() => setSaveNoticeOpen(false)}
                  className="touch-target w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs transition active:scale-95 shadow-md"
                >
                  Verstanden 👍
                </button>
              </div>
            </div>
          )}

          {}
          {pinModalOpen && (
            <div className="fixed inset-0 z-50 bg-zinc-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className={`w-full max-w-xs rounded-2xl border shadow-2xl p-5 space-y-4 animate-in fade-in zoom-in duration-150 ${
                darkMode ? 'bg-zinc-900 border-zinc-800 text-zinc-100' : 'bg-stone-100 border-stone-300 text-zinc-900'
              }`}>
                <div className="flex items-center justify-between border-b pb-3 border-stone-300/80 dark:border-zinc-800">
                  <div className="flex items-center gap-2">
                    <div className="bg-amber-500 text-zinc-950 p-1.5 rounded-lg">
                      <Icons.KeyRound className="w-4 h-4" />
                    </div>
                    <h3 className="font-bold text-sm">Admin PIN-Eingabe</h3>
                  </div>
                  <button 
                    onClick={() => setPinModalOpen(false)}
                    className="touch-target p-1 rounded-lg text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 transition"
                  >
                    <Icons.X className="w-4 h-4" />
                  </button>
                </div>

                <form onSubmit={handlePinSubmit} className="space-y-3">
                  <div className="space-y-1">
                    <label className="text-xs font-semibold text-zinc-500 dark:text-zinc-400">PIN eingeben:</label>
                    <input
                      type="password"
                      maxLength={4}
                      value={pinInput}
                      onChange={(e) => {
                        setPinInput(e.target.value);
                        setPinError(false);
                      }}
                      placeholder="****"
                      autoFocus
                      className={`w-full px-3 py-2 rounded-xl text-center font-mono text-lg tracking-widest border focus:outline-none focus:ring-2 focus:ring-amber-500 ${
                        darkMode ? 'bg-zinc-950 border-zinc-800 text-white' : 'bg-stone-200/80 border-stone-300 text-zinc-900'
                      }`}
                    />
                    {pinError && (
                      <p className="text-[11px] font-bold text-rose-500 text-center mt-1">Falsche PIN! Bitte erneut versuchen.</p>
                    )}
                  </div>

                  <div className="flex gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setPinModalOpen(false)}
                      className={`touch-target flex-1 py-2 rounded-xl text-xs font-bold border transition ${
                        darkMode ? 'bg-zinc-800 border-zinc-700 text-zinc-300' : 'bg-stone-200 border-stone-300 text-zinc-700'
                      }`}
                    >
                      Abbrechen
                    </button>
                    <button
                      type="submit"
                      className="touch-target flex-1 bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold py-2 rounded-xl text-xs transition active:scale-95"
                    >
                      Freischalten
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {}
          {paypalModalOpen && selectedPaypalPlayer && (
            <div className="fixed inset-0 z-50 bg-zinc-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className={`w-full max-w-md rounded-2xl border shadow-2xl p-5 space-y-4 animate-in fade-in zoom-in duration-150 ${
                darkMode ? 'bg-zinc-900 border-zinc-800 text-zinc-100' : 'bg-stone-100 border-stone-300 text-zinc-900'
              }`}>
                <div className="flex items-center justify-between border-b pb-3 border-stone-300/80 dark:border-zinc-800">
                  <div className="flex items-center gap-2">
                    <div className="bg-blue-600 text-white p-2 rounded-xl">
                      <Icons.CreditCard className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="font-bold text-base">PayPal Bezahlung</h3>
                      <p className="text-xs text-zinc-500 dark:text-zinc-400">Überweisung an Erwin D.</p>
                    </div>
                  </div>
                  <button 
                    onClick={() => setPaypalModalOpen(false)}
                    className="touch-target p-1.5 rounded-lg text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 transition"
                  >
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-3">
                  <div className={`p-3.5 rounded-xl border text-center space-y-1 ${
                    darkMode ? 'bg-zinc-950 border-zinc-800' : 'bg-stone-200/60 border-stone-300'
                  }`}>
                    <span className="text-xs text-zinc-500 dark:text-zinc-400 font-bold uppercase tracking-wider">Beitrag für {selectedPaypalPlayer.name}</span>
                    <p className="text-3xl font-black text-emerald-600 dark:text-emerald-400">{selectedPaypalPlayer.cost.toFixed(2)} €</p>
                    <p className="text-xs text-zinc-500 dark:text-zinc-400">({selectedPaypalPlayer.count} Spiele in der Wintersaison)</p>
                  </div>

                  <div className="p-3.5 bg-blue-500/10 border border-blue-500/20 rounded-xl text-xs text-blue-700 dark:text-blue-300 font-medium space-y-1">
                    <p className="font-bold">ℹ️ Hinweis zur Überweisung:</p>
                    <p className="text-[11px] leading-relaxed">
                      Die Bezahlung der Abogebühr geht an Erwin D. Bitte gib bei der Überweisung deinen Namen ({selectedPaypalPlayer.name}) im Verwendungszweck an.
                    </p>
                  </div>

                  <div className="space-y-1.5">
                    <label className="text-xs font-bold text-zinc-500 dark:text-zinc-400">PayPal-Link / Adresse:</label>
                    <div className={`p-2.5 rounded-xl border text-xs font-mono break-all flex items-center justify-between gap-2 ${
                      darkMode ? 'bg-zinc-950 border-zinc-800 text-blue-400' : 'bg-stone-200/80 border-stone-300 text-blue-700'
                    }`}>
                      <span className="truncate">https://paypal.me/tennis-abteilung-spaden</span>
                      <button
                        onClick={() => handleCopyPaypalLink("https://paypal.me/tennis-abteilung-spaden")}
                        className="touch-target p-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition flex-shrink-0 flex items-center justify-center"
                        title="Link kopieren"
                      >
                        {copiedPaypalLink ? <Icons.Check className="w-4 h-4" /> : <Icons.Copy className="w-4 h-4" />}
                      </button>
                    </div>
                  </div>
                </div>

                <div className="pt-2 flex items-center gap-2">
                  <a
                    href="https://paypal.me"
                    target="_blank"
                    rel="noreferrer"
                    className="touch-target flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-md transition active:scale-95 text-center"
                  >
                    PayPal.me Öffnen <Icons.ExternalLink className="w-3.5 h-3.5" />
                  </a>
                  <button
                    onClick={() => setPaypalModalOpen(false)}
                    className={`touch-target px-4 py-2.5 rounded-xl text-xs font-bold border transition ${
                      darkMode ? 'bg-zinc-800 border-zinc-700 text-zinc-300' : 'bg-stone-200 border-stone-300 text-zinc-700'
                    }`}
                  >
                    Schließen
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
